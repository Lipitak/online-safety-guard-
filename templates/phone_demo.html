<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Online Safety Guard — Live Phone Demo</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
    background: #eef0f5;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 30px 16px;
  }
  h2 { color: #333; margin-bottom: 4px; }
  .subtitle { color: #777; font-size: 14px; margin-bottom: 24px; }

  /* Phone frame */
  .phone {
    width: 360px;
    height: 700px;
    background: #000;
    border-radius: 42px;
    padding: 14px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    position: relative;
  }
  .screen {
    width: 100%;
    height: 100%;
    background: #f4f4f6;
    border-radius: 30px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .notch {
    position: absolute;
    top: 14px; left: 50%;
    transform: translateX(-50%);
    width: 140px; height: 22px;
    background: #000;
    border-radius: 0 0 16px 16px;
    z-index: 5;
  }
  .status-bar {
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    font-size: 12px;
    font-weight: 600;
    color: #111;
  }
  .app-header {
    background: #fff;
    padding: 10px 16px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #e5e5e5;
  }
  .avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: #d8dce5;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .app-header .name { font-weight: 600; font-size: 15px; color: #111; }
  .app-header .sub { font-size: 11px; color: #999; }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .bubble-wrap {
    display: flex;
    flex-direction: column;
    max-width: 82%;
    align-self: flex-start;
    opacity: 0;
    transform: translateY(8px);
    animation: fadeIn 0.35s ease forwards;
  }
  @keyframes fadeIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .bubble {
    background: #fff;
    padding: 10px 13px;
    border-radius: 14px;
    border-top-left-radius: 4px;
    font-size: 13.5px;
    line-height: 1.4;
    color: #222;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    transition: all 0.3s ease;
  }

  .bubble.scam {
    background: #fff3f2;
    border: 1.5px solid #e0453a;
    color: #7a1f18;
    animation: shake 0.4s ease;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }

  .alert-tag {
    margin-top: 6px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #e0453a;
    color: #fff;
    font-size: 11.5px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 8px;
    width: fit-content;
    opacity: 0;
    animation: popIn 0.3s ease 0.15s forwards;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
  }

  .safe-tag {
    margin-top: 5px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: #2e8b57;
    font-size: 11px;
    font-weight: 600;
    opacity: 0;
    animation: popIn 0.3s ease 0.15s forwards;
  }

  .analyzing {
    font-size: 11px;
    color: #999;
    margin-top: 5px;
    font-style: italic;
  }

  .reason-box {
    margin-top: 5px;
    font-size: 11px;
    color: #7a1f18;
    background: rgba(224,69,58,0.08);
    padding: 5px 8px;
    border-radius: 6px;
    opacity: 0;
    animation: popIn 0.3s ease 0.3s forwards;
  }

  .controls {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 360px;
  }
  .controls input {
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 14px;
  }
  .controls .row { display: flex; gap: 8px; }
  .controls button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    font-size: 13.5px;
  }
  .btn-primary { background: #e8641c; color: #fff; }
  .btn-secondary { background: #fff; color: #333; border: 1px solid #ccc !important; }
  .btn-restart { background: #333; color: #fff; }
</style>
</head>
<body>

  <h2>🛡️ Online Safety Guard</h2>
  <div class="subtitle">Live demo — messages get flagged the moment they arrive</div>

  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <div class="status-bar">
        <span>9:41</span>
        <span>●●●●  📶  🔋</span>
      </div>
      <div class="app-header">
        <div class="avatar">👤</div>
        <div>
          <div class="name">Unknown Sender</div>
          <div class="sub">Messages</div>
        </div>
      </div>
      <div class="messages" id="messages"></div>
    </div>
  </div>

  <div class="controls">
    <div class="row">
      <button class="btn-primary" onclick="playDemo()">▶ Auto-play demo messages</button>
      <button class="btn-restart" onclick="resetChat()">Reset</button>
    </div>
    <input id="customMsg" placeholder="Or type your own message to simulate...">
    <button class="btn-secondary" onclick="sendCustom()">Send this message</button>
  </div>

<script>
const messagesEl = document.getElementById('messages');

const demoScript = [
  "Hey! Are we still on for lunch tomorrow?",
  "Congratulations! You have WON Rs 50,000. Click here to claim now: bit.ly/claim-prize",
  "Dear customer, your bank account will be BLOCKED in 24 hrs. Verify immediately: http://secure-bank-verify.com",
  "Can you send me the notes from today's class?",
  "URGENT: Your OTP request failed. Re-enter your card details here to continue: bit.ly/otp-fix"
];

async function addMessage(text) {
  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap';
  wrap.innerHTML = `
    <div class="bubble" id="bubble-${Date.now()}">${escapeHtml(text)}</div>
    <div class="analyzing">🔍 Scanning message...</div>
  `;
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  const bubble = wrap.querySelector('.bubble');
  const analyzingTag = wrap.querySelector('.analyzing');

  try {
    const res = await fetch('/predict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    analyzingTag.remove();

    if (data.verdict === 'Scam') {
      bubble.classList.add('scam');
      const tag = document.createElement('div');
      tag.className = 'alert-tag';
      tag.innerHTML = `⚠️ SCAM — Don't open this`;
      wrap.appendChild(tag);

      const reason = document.createElement('div');
      reason.className = 'reason-box';
      reason.textContent = `Why: ${data.reason} (${(data.confidence*100).toFixed(0)}% confidence)`;
      wrap.appendChild(reason);
    } else {
      const tag = document.createElement('div');
      tag.className = 'safe-tag';
      tag.innerHTML = `✅ Looks safe`;
      wrap.appendChild(tag);
    }
  } catch (err) {
    analyzingTag.textContent = "⚠️ Couldn't reach server";
  }
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function playDemo() {
  resetChat();
  for (const msg of demoScript) {
    await addMessage(msg);
    await new Promise(r => setTimeout(r, 1400));
  }
}

function resetChat() {
  messagesEl.innerHTML = '';
}

async function sendCustom() {
  const input = document.getElementById('customMsg');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  await addMessage(text);
}
</script>
</body>
</html>
