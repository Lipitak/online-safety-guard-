<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #0b0f19;
    --card: #111827;
    --border: #1f293d;
    --accent-red: #ff3b30;
    --accent-green: #34c759;
    --accent-orange: #e8641c;
    --text: #f3f4f6;
    --muted: #9ca3af;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 320px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, #e8641c, #ff3b30);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .title {
    font-size: 14px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.3px;
  }

  .sub {
    font-size: 11px;
    color: var(--muted);
  }

  .status-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .status-info {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .pulse-dot {
    width: 10px;
    height: 10px;
    background: var(--accent-green);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--accent-green);
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.5; }
  }

  .status-text {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent-green);
  }

  /* Toggle Switch */
  .switch {
    position: relative;
    display: inline-block;
    width: 42px;
    height: 24px;
  }

  .switch input { opacity: 0; width: 0; height: 0; }

  .slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #374151;
    transition: .3s;
    border-radius: 24px;
  }

  .slider:before {
    position: absolute;
    content: "";
    height: 18px; width: 18px;
    left: 3px; bottom: 3px;
    background-color: white;
    transition: .3s;
    border-radius: 50%;
  }

  input:checked + .slider { background-color: var(--accent-green); }
  input:checked + .slider:before { transform: translateX(18px); }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }

  .stat-box {
    background: #111827;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    text-align: center;
  }

  .stat-num {
    font-size: 18px;
    font-weight: 800;
    color: #fff;
  }

  .stat-lbl {
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 2px;
    text-transform: uppercase;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 11px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    border: none;
    transition: all 0.2s;
    margin-bottom: 8px;
  }

  .btn-primary {
    background: linear-gradient(135deg, #e8641c, #ff3b30);
    color: #fff;
    box-shadow: 0 4px 15px rgba(232, 100, 28, 0.3);
  }

  .btn-secondary {
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    border: 1px solid var(--border);
  }

  .btn:hover {
    transform: translateY(-1px);
    opacity: 0.95;
  }

  .result-box {
    background: #000;
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 10px;
    font-size: 11.5px;
    color: var(--muted);
    display: none;
    margin-bottom: 12px;
    line-height: 1.4;
  }
</style>
</head>
<body>

  <div class="header">
    <div class="brand">
      <div class="logo">🛡️</div>
      <div>
        <div class="title">Online Safety Guard</div>
        <div class="sub">24/7 Automated Extension</div>
      </div>
    </div>
  </div>

  <div class="status-card">
    <div class="status-info">
      <div class="pulse-dot" id="pulseDot"></div>
      <div>
        <div class="status-text" id="statusText">24/7 GUARD ACTIVE</div>
        <div class="sub">Auto scanning tabs</div>
      </div>
    </div>
    <label class="switch">
      <input type="checkbox" id="guardToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="stats-grid">
    <div class="stat-box">
      <div class="stat-num" style="color: var(--accent-green);">100%</div>
      <div class="stat-lbl">Real-time Coverage</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" style="color: var(--accent-orange);">4 AI</div>
      <div class="stat-lbl">Active Agents</div>
    </div>
  </div>

  <button class="btn btn-secondary" id="scanCurrentBtn">🔍 Scan Active Page Now</button>

  <div id="scanResult" class="result-box"></div>

  <a href="http://localhost:5001" target="_blank" class="btn btn-primary">🚀 Open Full Dashboard</a>

  <script src="popup.js"></script>
</body>
</html>
